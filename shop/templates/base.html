<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Shopsite{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f8f8;
            margin: 0;
        }

        nav {
            background-color: #333;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        nav a:hover {
            color: #ffcc00;
        }

        .container {
            max-width: 900px;
            background: white;
            margin: 40px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1, h2, h3 {
            color: #333;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 6px 10px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ffcc00;
            color: #333;
        }

        .auth {
            float: right;
            color: #ccc;
        }

        .footer {
            text-align: center;
            padding: 15px;
            background: #333;
            color: #ccc;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'items_page' %}">Items</a>
        {% if user.is_authenticated %}
            <a href="{% url 'cart_page' %}">Cart</a>
            {% if user.is_staff %}
                <a href="{% url 'stata' %}">Statistics</a>
            {% endif %}
            <a href="{% url 'login' %}">Logout</a>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <div class="footer">
    </div>
</body>
</html>
