{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<h2>Create an account</h2>

<form method="post" style="max-width:400px; margin-top:20px;">
    {% csrf_token %}
    
    <label>Username:</label><br>
    <input type="text" name="username" required
           style="width:100%; padding:8px; margin-top:5px; border-radius:5px; border:1px solid #ccc;"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required
           style="width:100%; padding:8px; margin-top:5px; border-radius:5px; border:1px solid #ccc;"><br><br>

    <button type="submit"
            style="background:#333; color:white; border:none; padding:10px 18px;
                   border-radius:6px; cursor:pointer; font-weight:bold; transition:0.2s;">
        Register
    </button>
</form>

<p style="margin-top:15px;">
    Already have an account?
    <a href="{% url 'login' %}" 
       style="background:#ffcc00; color:#333; padding:8px 14px; border-radius:6px; 
              text-decoration:none; font-weight:bold; margin-left:5px;">
       Log in
    </a>
</p>
{% endblock %}
