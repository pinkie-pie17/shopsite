{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'admin/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'admin/css/login.css' %}">
</head>
<body class="login">
    <div id="container">
        <div id="header">
            <h1>Site Login</h1>
        </div>
        <div id="content-main">
            <form method="post" id="login-form">
                {% csrf_token %}
                <div class="form-row">
                    {{ form.username.label_tag }}
                    {{ form.username }}
                </div>
                <div class="form-row">
                    {{ form.password.label_tag }}
                    {{ form.password }}
                </div>

                {% if form.errors %}
                    <p class="errornote">Invalid username or password.</p>
                {% endif %}

                <div class="submit-row">
                    <input type="submit" value="Log in">
                </div>
            </form>
        </div>
    </div>
</body>
</html>
